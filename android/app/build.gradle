plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.windock.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.windock.app'
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName '0.2.4-aren.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    // Aren's fork: with ANDROID_KEYSTORE (the release workflow writes it from a secret) every build is signed with the same
    // key, so a new APK installs over the old one. Without it (a local build), Android's own debug key, as before.
    signingConfigs {
        debug {
            if (System.getenv('ANDROID_KEYSTORE')) {
                storeFile file(System.getenv('ANDROID_KEYSTORE'))
                storeType 'pkcs12'
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias 'aren'
                keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Release builds remain unsigned until external signing is configured.
            signingConfig signingConfigs.findByName('release')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { buildConfig true }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
